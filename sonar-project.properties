sonar.projectKey=CustomerFeedbackApp
sonar.projectName=CustomerFeedbackApp
sonar.sources=src,web/src
sonar.tests=tests,web/src
sonar.test.inclusions=tests/**,web/src/**/*.test.ts
sonar.exclusions=**/Migrations/**,**/bin/**,**/obj/**,web/node_modules/**,web/dist/**
sonar.coverage.exclusions=**/Migrations/**,**/Program.cs,tests/**
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
